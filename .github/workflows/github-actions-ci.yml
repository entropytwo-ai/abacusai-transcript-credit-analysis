name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: "shellcheck + tests (Linux: gawk, mawk, BWK awk, busybox)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install awk implementations and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck gawk mawk original-awk busybox
      - name: shellcheck
        run: make lint
      - name: tests
        run: make test

  macos:
    name: "tests (macOS: BSD awk/sort/date, Homebrew bash)"
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install bash 4+
        run: brew install bash
      - name: tests
        run: |
          export PATH="$(brew --prefix)/bin:$PATH"
          bash --version | head -n 1
          TEST_AWKS="awk" bash tests/run-tests.sh

  web:
    name: web dashboard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: pip install -r web/requirements-dev.txt
      - name: pytest
        working-directory: web
        run: python -m pytest -q tests
